name: Bug report
description: Something in the starter does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Do not report security vulnerabilities here — see [SECURITY.md](https://github.com/ajayyAI/ios-boilerplate/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you expected, and what happened instead.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction
      description: Steps from a fresh clone. Include the exact commands you ran.
      placeholder: |
        1. git clone ...
        2. brew bundle
        3. make check
    validations:
      required: true

  - type: textarea
    id: check-output
    attributes:
      label: "`make check` output"
      description: Paste the failing output, or the last lines if it is long.
      render: shell
    validations:
      required: true

  - type: input
    id: xcode
    attributes:
      label: Xcode version
      description: "`xcodebuild -version`"
      placeholder: "26.6"
    validations:
      required: true

  - type: input
    id: macos
    attributes:
      label: macOS version
      description: "`sw_vers -productVersion`"
    validations:
      required: true

  - type: input
    id: deployment-target
    attributes:
      label: Deployment target
      description: "`IPHONEOS_DEPLOYMENT_TARGET`, if you changed it."
      placeholder: "18.0"
    validations:
      required: false

  - type: checkboxes
    id: integrations
    attributes:
      label: Configured integrations
      description: Which keys are set in `Config/Secrets.xcconfig`?
      options:
        - label: RevenueCat
        - label: Sentry
        - label: PostHog
        - label: None — no `Config/Secrets.xcconfig` at all

  - type: textarea
    id: local-changes
    attributes:
      label: Local changes
      description: Anything you changed from a clean clone. "Nothing" is a valid answer.
    validations:
      required: false
