included:
  - Scaffold
  - ScaffoldTests
  - ScaffoldUITests

excluded:
  - ref                      # cloned reference repos, not our code
  - .build
  - DerivedData

opt_in_rules:
  - array_init
  - closure_end_indentation
  - closure_spacing
  - collection_alignment
  - contains_over_filter_count
  - contains_over_first_not_nil
  - discouraged_optional_boolean
  - empty_collection_literal
  - empty_count
  - empty_string
  - explicit_init
  - fallthrough
  - first_where
  - flatmap_over_map_reduce
  - force_unwrapping
  - implicitly_unwrapped_optional
  - last_where
  - legacy_multiple
  - literal_expression_end_indentation
  - multiline_arguments
  - operator_usage_whitespace
  - overridden_super_call
  - prefer_self_type_over_type_of_self
  - private_action
  - private_outlet
  - redundant_nil_coalescing
  - sorted_first_last
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - vertical_parameter_alignment_on_call
  - yoda_condition

disabled_rules:
  - trailing_comma           # SwiftFormat owns comma placement; the two disagree
  - line_length              # --maxwidth 120 in .swiftformat is the single source of truth
  - unused_closure_parameter # conflicts with --disable unusedArguments in .swiftformat
  - modifier_order           # SwiftFormat's modifierOrder rewrites these; it owns declaration ordering

force_unwrapping:
  severity: error

identifier_name:
  # The design tokens in Theme.swift use the t-shirt scale (xs/sm/md/lg/xl) that every
  # other design system uses. Spelling them out would be less recognisable, not clearer.
  excluded: [id, up, to, x, y, xs, sm, md, lg, xl]

type_body_length:
  warning: 250
  error: 400

file_length:
  warning: 400
  error: 600
